name: Build Android Bundle and APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build Release AAB & Debug APK
        run: |
          cd android
          gradle bundleRelease assembleDebug --stacktrace

      - name: Sign Release AAB
        run: |
          cd android/app/build/outputs/bundle/release
          keytool -genkeypair -v -keystore release.keystore -alias edebikart -keyalg RSA -keysize 2048 -validity 10000 -storepass edebikart123 -keypass edebikart123 -dname "CN=Edebikart, OU=Mobile, O=Edebikart, L=Bursa, S=Bursa, C=TR"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass edebikart123 -keypass edebikart123 app-release.aab edebikart

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
